name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # --runInBand expõe vazamento de estado global entre arquivos de teste
      # (foi assim que um teste flaky de analytics chegou à main antes do gate).
      # --coverage garante que o gate de branches seja verificado no CI.
      - name: Unit tests
        run: npx jest --config jest.unit.config.js --runInBand --coverage
